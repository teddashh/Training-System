server {
    listen 80;
    server_name _;
    # Refresh Docker service addresses after API/content containers are replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    root /usr/share/nginx/html;
    client_max_body_size 205m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Only files served from this container are compressed; proxied API and content responses are not.
    gzip off;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    location ^~ /content/ {
        # The host proxy already strips APP_BASE_PATH (/training in production).
        access_log off;
        set $content_path_upstream http://content:8001;
        rewrite ^/content/(.*)$ /$1 break;
        proxy_pass $content_path_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Training-Content-Path 1;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /admin/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ { proxy_pass $api_upstream; }
    location /assets/ {
        try_files $uri =404;
        gzip on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location = /index.html {
        try_files $uri =404;
        gzip on;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location = /studio/index.html {
        try_files $uri =404;
        gzip on;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location /covers/ {
        try_files $uri =404;
        gzip on;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location /studio/ {
        try_files $uri $uri/ /studio/index.html;
        gzip on;
    }
    location / {
        try_files $uri $uri/ /index.html;
        gzip on;
    }
}
server {
    listen 81;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $content_upstream http://content:8001;
    # Launch tickets must not be recorded in request logs.
    access_log off;
    location / {
        proxy_pass $content_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
