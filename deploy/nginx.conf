server {
    listen 80;
    server_name _;
    # Refresh Docker service addresses after API/content containers are replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    root /usr/share/nginx/html;
    client_max_body_size 205m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /admin/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ { proxy_pass $api_upstream; }
    location /studio/ { try_files $uri $uri/ /studio/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 81;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $content_upstream http://content:8001;
    # Launch tickets must not be recorded in request logs.
    access_log off;
    location / {
        proxy_pass $content_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
